[package]
name = "beam"
version = "0.1.0"
edition = "2024"
description = "Move a coding-agent session from your machine to a sandbox, and back"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
